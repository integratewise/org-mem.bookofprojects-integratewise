<!DOCTYPE html>
<html lang="en">
<head>
<script src="document-governance-seed.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IntegrateWise — Document Governance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#f4f0e8;--bg-deep:#ece7db;--surface:#ffffff;--surface-alt:#faf8f3;
  --border:#d4cdb8;--border-light:#e6e0d0;
  --text:#1a1a14;--text-muted:#6b6556;--text-faint:#9b9484;
  --heading:#1a3a2a;--gold:#b8943f;--gold-light:#d4ab5a;--gold-bg:#f5ecd4;
  --forest:#1a3a2a;--forest-light:#2d5a3d;--forest-deep:#0f2218;
  --green:#2d7a4f;--green-bg:#dafbe1;--green-border:#4ac97e;
  --blue:#0969da;--blue-bg:#ddf4ff;--blue-border:#54aeff;
  --amber:#bf8700;--amber-bg:#fff8c5;--amber-border:#d4a72c;
  --red:#cf222e;--red-bg:#ffebe9;--purple:#8250df;--purple-bg:#fbefff;
  --radius:8px;--radius-lg:12px;--radius-xl:16px;
  --font:'DM Sans',-apple-system,sans-serif;
  --serif:'Lora',Georgia,serif;--mono:'DM Mono','SFMono-Regular',monospace;
  --shadow-sm:0 1px 3px rgba(26,26,20,.06);
  --shadow-md:0 4px 12px rgba(26,26,20,.08);
  --shadow-lg:0 8px 30px rgba(26,26,20,.12);
  --sidebar-w:270px;--panel-w:620px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6;font-size:14px;min-height:100vh;overflow-x:hidden}

.app{display:flex;min-height:100vh}

/* ── Sidebar ── */
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,#0f2218 0%,#162e20 100%);color:#c8d6cc;position:fixed;top:0;left:0;bottom:0;overflow-y:auto;z-index:100;display:flex;flex-direction:column}
.sidebar-brand{padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,.06)}
.sidebar-brand h1{font-family:var(--serif);font-size:19px;font-weight:700;color:#e8e0d0;letter-spacing:-.3px}
.sidebar-brand .sub{font-size:10px;color:#6a8a74;font-family:var(--mono);margin-top:3px;letter-spacing:.3px}
.sidebar-section{padding:16px 12px 4px}
.sidebar-section-title{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:#4a6a54;padding:0 8px;margin-bottom:6px}
.sidebar-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:5px;cursor:pointer;font-size:12.5px;font-weight:500;color:#8aaa94;transition:all .15s;user-select:none}
.sidebar-item:hover{background:rgba(255,255,255,.06);color:#c0d4c4}
.sidebar-item.active{background:rgba(184,148,63,.12);color:#d4ab5a}
.sidebar-item .cb{margin-left:auto;font-size:9.5px;font-weight:700;font-family:var(--mono);background:rgba(255,255,255,.07);color:#5a7a64;padding:1px 6px;border-radius:8px;min-width:20px;text-align:center}
.sidebar-item.active .cb{background:rgba(184,148,63,.18);color:#d4ab5a}
.sidebar-item .ic{width:16px;text-align:center;font-size:11px;flex-shrink:0}
.sidebar-footer{margin-top:auto;padding:16px 20px;border-top:1px solid rgba(255,255,255,.06);font-size:10px;color:#3a5a44;font-family:var(--mono)}

/* ── Main ── */
.main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;transition:margin-right .3s ease}
.main.panel-open{margin-right:var(--panel-w)}

.topbar{position:sticky;top:0;z-index:50;background:rgba(244,240,232,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border-light);padding:14px 32px;display:flex;align-items:center;gap:16px}
.topbar-title{font-family:var(--serif);font-size:17px;font-weight:700;color:var(--heading)}
.topbar-desc{font-size:11.5px;color:var(--text-muted)}
.search-box{margin-left:auto;position:relative}
.search-box input{font-family:var(--font);font-size:12.5px;padding:7px 12px 7px 32px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);width:240px;outline:none;transition:border .2s}
.search-box input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,148,63,.1)}
.search-box::before{content:'⌕';position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text-faint);pointer-events:none}

/* ── Stats ── */
.dashboard{padding:20px 32px 8px}
.stats-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.stat-card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:14px 16px;display:flex;align-items:center;gap:12px;transition:box-shadow .2s}
.stat-card:hover{box-shadow:var(--shadow-sm)}
.stat-icon{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.stat-icon.green{background:var(--green-bg);color:var(--green)}.stat-icon.gold{background:var(--gold-bg);color:var(--gold)}
.stat-icon.blue{background:var(--blue-bg);color:var(--blue)}.stat-icon.amber{background:var(--amber-bg);color:var(--amber)}
.stat-icon.purple{background:var(--purple-bg);color:var(--purple)}
.stat-number{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--heading);line-height:1}
.stat-label{font-size:10.5px;color:var(--text-muted);margin-top:1px}

/* ── Content ── */
.content{padding:0 32px 60px}
.section-header{display:flex;align-items:center;gap:10px;margin:24px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--border-light)}
.section-header h2{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--heading)}
.section-header .sc{font-size:10px;font-weight:700;font-family:var(--mono);background:var(--bg-deep);color:var(--text-muted);padding:2px 8px;border-radius:8px}

.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.doc-card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:14px 16px;transition:all .2s;cursor:pointer;display:flex;flex-direction:column;gap:8px;position:relative}
.doc-card:hover{box-shadow:var(--shadow-md);border-color:var(--border)}
.doc-card.has-content::after{content:'';position:absolute;top:12px;right:12px;width:6px;height:6px;border-radius:50%;background:var(--green)}
.doc-card-top{display:flex;align-items:flex-start;gap:8px}
.doc-card-top h4{font-size:13px;font-weight:600;color:var(--heading);line-height:1.3;flex:1}
.doc-card-desc{font-size:12px;color:var(--text-muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc-card-meta{display:flex;align-items:center;gap:10px;font-size:10px;color:var(--text-faint);font-family:var(--mono);margin-top:auto;padding-top:6px;border-top:1px solid var(--border-light)}
.doc-card-tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:9px;font-weight:600;padding:1px 6px;border-radius:3px;background:var(--bg-deep);color:var(--text-muted)}
.tag.arch{background:var(--purple-bg);color:var(--purple)}.tag.product{background:var(--green-bg);color:var(--green)}
.tag.gtm{background:var(--gold-bg);color:#7a5c10}.tag.eng{background:var(--blue-bg);color:var(--blue)}
.tag.strategy{background:var(--red-bg);color:#9a1a24}

.status-badge{font-size:9px;font-weight:700;font-family:var(--mono);padding:2px 8px;border-radius:3px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap;flex-shrink:0}
.status-badge.locked{background:var(--green-bg);color:#1a5d34}
.status-badge.drafted{background:var(--gold-bg);color:#7a5c10}
.status-badge.pending{background:var(--amber-bg);color:#7a5500}
.status-badge.inprogress{background:var(--blue-bg);color:#0a4a9a}
.status-badge.na{background:#f0ece4;color:var(--text-faint)}

.priority{font-weight:700}.priority.critical{color:var(--red)}.priority.high{color:var(--amber)}.priority.medium{color:var(--blue)}.priority.low{color:var(--text-faint)}

/* ── Side Panel ── */
.panel{position:fixed;top:0;right:0;width:var(--panel-w);height:100vh;background:var(--surface);border-left:1px solid var(--border);z-index:200;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s ease;box-shadow:-4px 0 20px rgba(0,0,0,.08)}
.panel.open{transform:translateX(0)}
.panel-header{padding:20px 24px 16px;border-bottom:1px solid var(--border-light);flex-shrink:0}
.panel-header-top{display:flex;align-items:flex-start;gap:12px}
.panel-header h3{font-family:var(--serif);font-size:18px;font-weight:700;color:var(--heading);flex:1;line-height:1.3}
.panel-close{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:grid;place-items:center;font-size:14px;color:var(--text-muted);transition:all .15s;flex-shrink:0}
.panel-close:hover{background:var(--bg);color:var(--text)}
.panel-meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.panel-meta-item{font-size:10.5px;font-family:var(--mono);color:var(--text-muted)}

.panel-tabs{display:flex;border-bottom:1px solid var(--border-light);flex-shrink:0}
.panel-tab{flex:1;padding:10px;text-align:center;font-size:12px;font-weight:600;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s}
.panel-tab:hover{color:var(--text)}
.panel-tab.active{color:var(--heading);border-bottom-color:var(--gold)}

.panel-body{flex:1;overflow-y:auto;padding:0}
.tab-content{display:none}
.tab-content.active{display:block}

/* ── Content View ── */
.content-view{padding:24px}
.content-view .doc-prose{font-size:13.5px;line-height:1.75;color:var(--text)}
.content-view .doc-prose h1{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--heading);margin:0 0 6px;letter-spacing:-.4px}
.content-view .doc-prose h2{font-family:var(--serif);font-size:20px;font-weight:700;color:var(--heading);margin:28px 0 8px;letter-spacing:-.2px;border-bottom:1px solid var(--border-light);padding-bottom:6px}
.content-view .doc-prose h3{font-size:15px;font-weight:700;color:var(--heading);margin:20px 0 6px}
.content-view .doc-prose h4{font-size:13.5px;font-weight:700;color:var(--heading);margin:16px 0 4px}
.content-view .doc-prose p{margin-bottom:12px}
.content-view .doc-prose strong{color:var(--text);font-weight:600}
.content-view .doc-prose em{font-style:italic}
.content-view .doc-prose ul,.content-view .doc-prose ol{margin:0 0 12px 18px;font-size:13px}
.content-view .doc-prose li{margin-bottom:4px;line-height:1.6}
.content-view .doc-prose blockquote{border-left:3px solid var(--gold);background:var(--gold-bg);padding:12px 16px;margin:16px 0;border-radius:0 var(--radius) var(--radius) 0;font-style:italic;color:#5c4813}
.content-view .doc-prose code{font-family:var(--mono);font-size:12px;background:#f0ece4;padding:1px 5px;border-radius:3px}
.content-view .doc-prose pre{background:var(--forest-deep);color:#e6edf3;padding:16px;border-radius:var(--radius);overflow-x:auto;margin:16px 0;font-family:var(--mono);font-size:12px;line-height:1.7}
.content-view .doc-prose pre code{background:none;padding:0;color:inherit}
.content-view .doc-prose hr{border:none;border-top:1px solid var(--border-light);margin:24px 0}
.content-view .doc-prose table{width:100%;border-collapse:collapse;margin:12px 0;font-size:12.5px}
.content-view .doc-prose table th{padding:8px 12px;text-align:left;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);border-bottom:2px solid var(--border);background:#f0ece4}
.content-view .doc-prose table td{padding:8px 12px;border-bottom:1px solid var(--border-light);color:var(--text)}

/* ── Edit Area ── */
.content-edit{padding:20px 24px;height:100%;display:flex;flex-direction:column}
.content-edit textarea{flex:1;font-family:var(--mono);font-size:12.5px;line-height:1.7;padding:16px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-alt);color:var(--text);resize:none;outline:none}
.content-edit textarea:focus{border-color:var(--gold)}
.edit-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.edit-bar .hint{font-size:11px;color:var(--text-faint);font-family:var(--mono);margin-left:auto}

/* ── Settings Tab ── */
.settings-content{padding:24px}
.settings-content label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);margin-bottom:4px;margin-top:14px}
.settings-content label:first-child{margin-top:0}
.settings-content select,.settings-content input[type="text"],.settings-content textarea{width:100%;font-family:var(--font);font-size:12.5px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface-alt);color:var(--text);outline:none}
.settings-content textarea{resize:vertical;min-height:80px;font-size:12px;line-height:1.6}
.settings-content select:focus,.settings-content input:focus,.settings-content textarea:focus{border-color:var(--gold)}
.settings-save{margin-top:20px}

/* ── Buttons ── */
.btn{font-family:var(--font);font-size:12px;font-weight:600;padding:7px 16px;border-radius:var(--radius);cursor:pointer;transition:all .15s;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--forest);color:#e8e0d0;border-color:var(--forest)}.btn-primary:hover{background:var(--forest-light)}
.btn-ghost{background:transparent;color:var(--text-muted);border-color:var(--border)}.btn-ghost:hover{background:var(--bg);color:var(--text)}
.btn-gold{background:var(--gold);color:#fff;border-color:var(--gold)}.btn-gold:hover{background:var(--gold-light)}
.btn-sm{font-size:11px;padding:5px 12px}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-faint)}
.empty-state .ei{font-size:28px;margin-bottom:10px;opacity:.4}
.empty-state p{font-size:12px}

@media(max-width:1200px){.stats-row{grid-template-columns:repeat(3,1fr)}}
@media(max-width:900px){.sidebar{display:none}.main{margin-left:0}.topbar,.dashboard,.content{padding-left:16px;padding-right:16px}.doc-grid{grid-template-columns:1fr}.panel{width:100%}--panel-w:100%}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.doc-card{animation:fadeUp .25s ease forwards}
</style>
</head>
<body>
<div class="app">
<div class="sidebar" id="sidebar"></div>
<div class="main" id="main">
  <div class="topbar">
    <div><div class="topbar-title" id="topbar-title">All Documents</div><div class="topbar-desc" id="topbar-desc">Complete document governance</div></div>
    <div class="search-box"><input type="text" id="searchInput" placeholder="Search documents..."></div>
  </div>
  <div class="dashboard"><div class="stats-row" id="stats-row"></div></div>
  <div class="content" id="content"></div>
</div>
<div class="panel" id="panel">
  <div class="panel-header">
    <div class="panel-header-top"><h3 id="panel-title">Document</h3><button class="panel-close" onclick="closePanel()">✕</button></div>
    <div class="panel-meta" id="panel-meta"></div>
  </div>
  <div class="panel-tabs" id="panel-tabs">
    <div class="panel-tab active" data-tab="content" onclick="switchTab('content')">Content</div>
    <div class="panel-tab" data-tab="settings" onclick="switchTab('settings')">Settings</div>
  </div>
  <div class="panel-body">
    <div class="tab-content active" id="tab-content"></div>
    <div class="tab-content" id="tab-settings"></div>
  </div>
</div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// DOCUMENT REGISTRY
// ═══════════════════════════════════════════════════════
const R=[

let currentView='all';
let searchQuery='';
let currentDocIdx=null;
let editing=false;

function getState(){
  try{return JSON.parse(localStorage.getItem('iw-state')||'{}')}catch{return{}}
}
function setState(k,v){
  const s=getState();s[k]=v;
  try{localStorage.setItem('iw-state',JSON.stringify(s))}catch(e){console.warn('Storage full',e)}
}
function getDoc(idx){
  const s=getState();
  const base=R[idx];
  const saved=s['doc_'+idx];
  return saved?{...base,...saved,idx}:{...base,idx};
}
function saveDoc(idx,data){
  setState('doc_'+idx,data);
}
function getContent(idx){
  const s=getState();
  return s['content_'+idx]||null;
}
function saveContent(idx,content){
  setState('content_'+idx,content);
}

function renderSidebar(){
  const el=document.getElementById('sidebar');
  let h='';
  SIDEBAR.forEach(sec=>{
    if(sec.type==='brand'){
      h+=`<div class="sidebar-brand"><h1>IntegrateWise</h1><div class="sub">Document Governance</div></div>`;
      return;
    }
    h+=`<div class="sidebar-section"><div class="sidebar-section-title">${sec.title}</div>`;
    sec.items.forEach(item=>{
      const active=currentView===item.id?' active':'';
      const count=getCountForView(item.id);
      const icStyle=item.iconColor?` style="color:${item.iconColor}"`:'';
      h+=`<div class="sidebar-item${active}" data-view="${item.id}"><span class="ic"${icStyle}>${item.icon}</span>${item.label}<span class="cb">${count}</span></div>`;
    });
    h+=`</div>`;
  });
  h+=`<div class="sidebar-footer">v3.0 · live</div>`;
  el.innerHTML=h;
  el.querySelectorAll('.sidebar-item').forEach(item=>{
    item.addEventListener('click',()=>{
      currentView=item.dataset.view;
      editing=false;
      closePanel();
      render();
    });
  });
}

function getCountForView(view){
  const docs=getFilteredDocs(view,'');
  return docs.length;
}

// ═══════════════════════════════════════════════════════
// FILTER + RENDER GRID
// ═══════════════════════════════════════════════════════
function getFilteredDocs(view,query){
  let docs=R.map((_,i)=>getDoc(i));
  if(view!=='all'){
    if(view.startsWith('status-')){
      const st=view.replace('status-','');
      docs=docs.filter(d=>d.st===st);
    }else{
      docs=docs.filter(d=>d.c===view||d.s===view);
    }
  }
  if(query){
    const q=query.toLowerCase();
    docs=docs.filter(d=>d.n.toLowerCase().includes(q)||d.d.toLowerCase().includes(q)||(d.l&&d.l.toLowerCase().includes(q)));
  }
  return docs;
}

const SUB_NAMES={'public-product':'Product & Website','public-docs':'Documentation','public-gtm':'GTM & Sales','public-support':'Support & Community','internal-arch':'Architecture & Engineering','internal-ops':'Operations & DevOps','internal-ai':'AI & Cognition','internal-org':'Organizational','strategy-vision':'Vision & Direction','strategy-market':'Market & GTM Strategy','strategy-platform':'Platform & Technical Strategy'};
const SUB_ORDER=['public-product','public-docs','public-gtm','public-support','internal-arch','internal-ops','internal-ai','internal-org','strategy-vision','strategy-market','strategy-platform'];

function renderContent(){
  const docs=getFilteredDocs(currentView,searchQuery);
  const meta=VIEW_META[currentView]||VIEW_META['all'];
  document.getElementById('topbar-title').textContent=meta.t;
  document.getElementById('topbar-desc').textContent=meta.d;

  if(docs.length===0){
    document.getElementById('content').innerHTML=`<div class="empty-state"><div class="ei">◇</div><p>No documents match.</p></div>`;
    return;
  }

  const shouldGroup=['all','public','internal','strategy'].includes(currentView);
  let h='';

  if(shouldGroup){
    const groups={};
    docs.forEach(d=>{const k=d.s||d.c;if(!groups[k])groups[k]=[];groups[k].push(d);});
    SUB_ORDER.forEach(key=>{
      if(!groups[key])return;
      const g=groups[key];
      h+=`<div class="section-header"><h2>${SUB_NAMES[key]||key}</h2><span class="sc">${g.length}</span></div><div class="doc-grid">`;
      g.forEach(d=>h+=renderCard(d));
      h+=`</div>`;
    });
  }else{
    h+=`<div class="doc-grid">`;
    docs.forEach(d=>h+=renderCard(d));
    h+=`</div>`;
  }
  document.getElementById('content').innerHTML=h;

  document.querySelectorAll('.doc-card').forEach(card=>{
    card.addEventListener('click',()=>openPanel(parseInt(card.dataset.idx)));
  });
}

function renderCard(d){
  const hasContent=getContent(d.idx)!==null;
  const tagH=(d.t||[]).map(t=>`<span class="tag ${t}">${t}</span>`).join('');
  const stLabel={locked:'locked',drafted:'drafted',inprogress:'in progress',pending:'pending',na:'n/a'};
  const pLabel={critical:'CRIT',high:'HIGH',medium:'MED',low:'LOW'};
  return `<div class="doc-card${hasContent?' has-content':''}" data-idx="${d.idx}">
    <div class="doc-card-top"><h4>${d.n}</h4><span class="status-badge ${d.st}">${stLabel[d.st]||d.st}</span></div>
    <div class="doc-card-desc">${d.d}</div>
    ${tagH?'<div class="doc-card-tags">'+tagH+'</div>':''}
    <div class="doc-card-meta"><span class="priority ${d.p}">${pLabel[d.p]||d.p}</span>${d.l?'<span>→ '+d.l+'</span>':''}</div>
  </div>`;
}

// PANEL
// ═══════════════════════════════════════════════════════
function openPanel(idx){
  currentDocIdx=idx;
  editing=false;
  const d=getDoc(idx);
  document.getElementById('panel-title').textContent=d.n;

  const stLabel={locked:'Locked',drafted:'Drafted',inprogress:'In Progress',pending:'Pending'};
  const pLabel={critical:'Critical',high:'High',medium:'Medium',low:'Low'};
  let meta=`<span class="status-badge ${d.st}">${stLabel[d.st]||d.st}</span>`;
  meta+=`<span class="panel-meta-item priority ${d.p}">${pLabel[d.p]||d.p}</span>`;
  meta+=`<span class="panel-meta-item">${d.c}</span>`;
  if(d.l)meta+=`<span class="panel-meta-item">→ ${d.l}</span>`;
  document.getElementById('panel-meta').innerHTML=meta;

  renderContentTab();
  renderSettingsTab();
  switchTab('content');

  document.getElementById('panel').classList.add('open');
  document.getElementById('main').classList.add('panel-open');
}

function closePanel(){
  document.getElementById('panel').classList.remove('open');
  document.getElementById('main').classList.remove('panel-open');
  currentDocIdx=null;
  editing=false;
}

function switchTab(tab){
  document.querySelectorAll('.panel-tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.toggle('active',t.id==='tab-'+tab));
}

function renderContentTab(){
  const idx=currentDocIdx;
  if(idx===null)return;
  const content=getContent(idx);

  if(editing){
    const val=content!==null?content:getTemplate(idx);
    document.getElementById('tab-content').innerHTML=`
      <div class="content-edit">
        <div class="edit-bar">
          <button class="btn btn-primary btn-sm" onclick="saveContentEdit()">Save</button>
          <button class="btn btn-ghost btn-sm" onclick="cancelEdit()">Cancel</button>
          <span class="hint">Markdown supported — # headings, **bold**, - lists, > quotes, \`\`\` code</span>
        </div>
        <textarea id="editArea">${escHtml(val)}</textarea>
      </div>`;
  }else{
    const rendered=content!==null?renderMarkdown(content):`<div style="padding:40px;text-align:center;color:var(--text-faint)"><p style="font-size:14px;margin-bottom:16px">No content yet.</p><button class="btn btn-gold btn-sm" onclick="startEdit()">Start Writing</button></div>`;
    document.getElementById('tab-content').innerHTML=`
      <div class="content-view">
        <div style="margin-bottom:16px;display:flex;gap:8px">

      </select>
      <label>Priority</label>
      <select id="set-priority">
        <option value="low"${d.p==='low'?' selected':''}>Low</option>
        <option value="medium"${d.p==='medium'?' selected':''}>Medium</option>
        <option value="high"${d.p==='high'?' selected':''}>High</option>
        <option value="critical"${d.p==='critical'?' selected':''}>Critical</option>
      </select>
      <label>Linked Documents</label>
      <input type="text" id="set-linked" value="${escHtml(d.l||'')}" placeholder="e.g. Architecture Doc v3.0">
      <label>Internal Notes</label>
      <textarea id="set-notes" placeholder="Notes about this document...">${escHtml(d.notes||'')}</textarea>
      <div class="settings-save"><button class="btn btn-primary btn-sm" onclick="saveSettings()">Save Settings</button></div>
    </div>`;
}

function startEdit(){editing=true;renderContentTab();}
function cancelEdit(){editing=false;renderContentTab();}
function saveContentEdit(){
  const val=document.getElementById('editArea').value;
  saveContent(currentDocIdx,val);
  editing=false;
  renderContentTab();
  renderContent();
}
function copyContent(){
  const c=getContent(currentDocIdx);
  if(c)navigator.clipboard.writeText(c).then(()=>{});
}
function saveSettings(){
  saveDoc(currentDocIdx,{
    st:document.getElementById('set-status').value,
    p:document.getElementById('set-priority').value,
    l:document.getElementById('set-linked').value,
    notes:document.getElementById('set-notes').value
  });
  const d=getDoc(currentDocIdx);
  const stLabel={locked:'Locked',drafted:'Drafted',inprogress:'In Progress',pending:'Pending'};
  const pLabel={critical:'Critical',high:'High',medium:'Medium',low:'Low'};
  let meta=`<span class="status-badge ${d.st}">${stLabel[d.st]||d.st}</span>`;
  meta+=`<span class="panel-meta-item priority ${d.p}">${pLabel[d.p]||d.p}</span>`;
  meta+=`<span class="panel-meta-item">${d.c}</span>`;
  if(d.l)meta+=<span class="panel-meta-item">→ ${d.l}</span>`;
  document.getElementById('panel-meta').innerHTML=meta;
  renderContent();
}

// SIMPLE MARKDOWN RENDERER
// ═══════════════════════════════════════════════════════
function renderMarkdown(md){
  if(!md)return'';
  let h=md;
  // Code blocks
  h=h.replace(/```(\w*)\n([\s\S]*?)```/g,(m,lang,code)=>`<pre><code>${escHtml(code.trim())}</code></pre>`);
  // Tables
  h=h.replace(/^(\|.+\|)\n(\|[-| :]+\|)\n((?:\|.+\|\n?)+)/gm,(m,header,sep,body)=>{
    const cols=header.split('|').filter(c=>c.trim());
    const rows=body.trim().split('\n');
    let t='<table><thead><tr>';
    cols.forEach(c=>t+=`<th>${c.trim()}</th>`);
    t+='</tr></thead><tbody>';
    rows.forEach(r=>{
      const cells=r.split('|').filter(c=>c.trim());
      t+='<tr>';
      cells.forEach(c=>t+=`<td>${c.trim()}</td>`);
      t+='</tr>';
    });
    t+='</tbody></table>';
    return t;
  });
  // Headers
  h=h.replace(/^#### (.+)$/gm,'<h4>$1</h4>');
  h=h.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  h=h.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  h=h.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  // Blockquote
  h=h.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');
  // HR
  h=h.replace(/^---$/gm,'<hr>');
  // Bold and italic
  h=h.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  h=h.replace(/\*(.+?)\*/g,'<em>$1</em>');
  // Inline code
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  // Unordered lists
  h=h.replace(/^- (.+)$/gm,'<li>$1</li>');
  h=h.replace(/(<li>.*<\/li>\n?)+/g,m=>`<ul>${m}</ul>`);
  // Ordered lists
  h=h.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  // Paragraphs
  h=h.replace(/\n\n(?!<)/g,'</p><p>');
  h=h.replace(/\n(?!<)/g,'<br>');
  h='<p>'+h+'</p>';
  // Clean up
  h=h.replace(/<p>\s*<(h[1-4]|ul|ol|table|pre|blockquote|hr)/g,'<$1');
  h=h.replace(/<\/(h[1-4]|ul|ol|table|pre|blockquote)>\s*<\/p>/g,'</$1>');
  h=h.replace(/<p>\s*<\/p>/g,'');
  h=h.replace(/<p><hr><\/p>/g,'<hr>');
  h=h.replace(/<p><br><\/p>/g,'');
  return h;
}

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
