name: Cloudflare Pages Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Where to deploy this ref"
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production

concurrency:
  group: cloudflare-pages-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PROJECT_NAME: spine-org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Resolve Pages branch target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "deploy_target=preview" >> "$GITHUB_OUTPUT"
            echo "pages_branch=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.deploy_target }}" == "production" ]]; then
              echo "deploy_target=production" >> "$GITHUB_OUTPUT"
              echo "pages_branch=main" >> "$GITHUB_OUTPUT"
            else
              echo "deploy_target=preview" >> "$GITHUB_OUTPUT"
              echo "pages_branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "deploy_target=production" >> "$GITHUB_OUTPUT"
            echo "pages_branch=main" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_target=preview" >> "$GITHUB_OUTPUT"
            echo "pages_branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

          echo "Resolved deploy_target=$(cat "$GITHUB_OUTPUT" | grep '^deploy_target=' | cut -d= -f2)"
          echo "Resolved pages_branch=$(cat "$GITHUB_OUTPUT" | grep '^pages_branch=' | cut -d= -f2)"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ env.PROJECT_NAME }}
            --branch=${{ steps.target.outputs.pages_branch }}
